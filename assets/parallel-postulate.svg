<svg width="@00" height="200" xmlns="http://www.w3.org/2000/svg">

    <style>
        <![CDATA[
            :root {
                --textsize: 1em;
                --foreground: rgb(224 224 224);
            }

            @font-face {
                font-family: 'Latin Modern Math';
                src: url('/fonts/LatinModernMath-Regular.woff2') format('woff2'),
                    url('/fonts/LatinModernMath-Regular.woff') format('woff');
                font-weight: normal;
                font-style: normal;
                font-display: swap;
            }

            text {
                font-family: 'Latin Modern Math';
                font-size: var(--textsize);
                fill: var(--foreground);
            }

            line {
